<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <style>
      .hello {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 52px;
        font-weight: bold;
        fill: white;
        letter-spacing: 4px;
        animation: pulse 2.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.6; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" rx="16" ry="16" fill="url(#bgGrad)"/>

  <!-- Animated "Hello" text -->
  <text class="hello" x="400" y="70" text-anchor="middle" dominant-baseline="middle">Hello</text>
</svg>
